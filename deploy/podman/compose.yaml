services:
  postgres:
    image: docker.io/library/postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - database

  api:
    build:
      context: ../..
      dockerfile: deploy/podman/dev.Containerfile
    image: s2-assets-dev:local
    userns_mode: keep-id
    working_dir: /work
    volumes:
      - ../..:/work:z
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
    command: pnpm --filter api run dev
    depends_on:
      - postgres
    networks:
      - default
      - database

  web:
    build:
      context: ../..
      dockerfile: deploy/podman/dev.Containerfile
    image: s2-assets-dev:local
    userns_mode: keep-id
    working_dir: /work
    volumes:
      - ../..:/work:z
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5173}:5173"
    environment:
      NODE_ENV: development
    command: pnpm --filter web run dev
    depends_on:
      - api
    networks:
      - default

networks:
  default:
  database:
    internal: true

volumes:
  postgres-data:
