services:
  postgres:
    labels:
      io.9gotstory.s2-assets.verify-run: ${FOUNDATION_VERIFY_RUN_ID:-unclaimed}
      io.9gotstory.s2-assets.verify-project: ${COMPOSE_PROJECT_NAME:-unclaimed}
      io.9gotstory.s2-assets.verify-service: postgres
    image: docker.io/library/postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - database

  api:
    labels:
      io.9gotstory.s2-assets.verify-run: ${FOUNDATION_VERIFY_RUN_ID:-unclaimed}
      io.9gotstory.s2-assets.verify-project: ${COMPOSE_PROJECT_NAME:-unclaimed}
      io.9gotstory.s2-assets.verify-service: api
    build:
      context: ../..
      dockerfile: deploy/podman/dev.Containerfile
    image: s2-assets-dev:local
    userns_mode: keep-id
    working_dir: /work
    volumes:
      - ../..:/work:z
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
    command: node --watch apps/api/src/server.ts
    depends_on:
      - postgres
    networks:
      - default
      - database

  web:
    labels:
      io.9gotstory.s2-assets.verify-run: ${FOUNDATION_VERIFY_RUN_ID:-unclaimed}
      io.9gotstory.s2-assets.verify-project: ${COMPOSE_PROJECT_NAME:-unclaimed}
      io.9gotstory.s2-assets.verify-service: web
    build:
      context: ../..
      dockerfile: deploy/podman/dev.Containerfile
    image: s2-assets-dev:local
    userns_mode: keep-id
    working_dir: /work
    volumes:
      - ../..:/work:z
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5173}:5173"
    environment:
      NODE_ENV: development
    command: node apps/web/node_modules/vite/bin/vite.js apps/web
    depends_on:
      - api
    networks:
      - default

networks:
  default:
    labels: &verification-labels
      io.9gotstory.s2-assets.verify-run: ${FOUNDATION_VERIFY_RUN_ID:-unclaimed}
      io.9gotstory.s2-assets.verify-project: ${COMPOSE_PROJECT_NAME:-unclaimed}
      io.9gotstory.s2-assets.verify-resource: default
  database:
    labels:
      <<: *verification-labels
      io.9gotstory.s2-assets.verify-resource: database
    internal: true

volumes:
  postgres-data:
    labels:
      <<: *verification-labels
      io.9gotstory.s2-assets.verify-resource: postgres-data
