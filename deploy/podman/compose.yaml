services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-s2_assets}
      POSTGRES_USER: ${POSTGRES_USER:-s2_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-s2_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - database

  api:
    image: node:24.21.0-alpine
    userns_mode: keep-id
    working_dir: /work
    volumes:
      - ../..:/work
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-s2_user}:${POSTGRES_PASSWORD:-s2_password}@postgres:5432/${POSTGRES_DB:-s2_assets}
    depends_on:
      - postgres
    networks:
      - default
      - database

  web:
    image: node:24.21.0-alpine
    userns_mode: keep-id
    working_dir: /work
    volumes:
      - ../..:/work
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
    depends_on:
      - api
    networks:
      - default

networks:
  default:
  database:
    internal: true

volumes:
  postgres-data:
